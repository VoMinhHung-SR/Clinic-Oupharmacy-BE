name: storeApp tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  storeapp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run storeApp.tests (SQLite test settings)
        env:
          DJANGO_SETTINGS_MODULE: OUPharmacyManagementApp.settings_test
          SECRET_KEY: ci-django-secret-key-not-for-production
          DEBUG: "False"
          FIREBASE_SKIP_INIT: "1"
          OAUTH2_CLIENT_ID: test-oauth-client-id
          OAUTH2_CLIENT_SECRET: test-oauth-client-secret
          CLOUDINARY_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
        run: python manage.py test storeApp.tests -v 2 --settings=OUPharmacyManagementApp.settings_test
